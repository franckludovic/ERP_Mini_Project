<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Nexus ERP - Production Manager</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "fontFamily": { "body-md": ["Inter"] }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            vertical-align: middle;
        }
        body { background-color: #fcf8ff; }
        #main-content { transition: opacity 0.2s ease-in-out; }
        #main-content.htmx-request { opacity: 0.3; pointer-events: none; }
    </style>
</head>
<body class="font-body-md text-slate-900 antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

<aside class="h-screen w-64 fixed left-0 top-0 border-r border-slate-200 bg-white shadow-[4px_0_24px_rgba(15,23,42,0.02)] flex flex-col p-4 gap-2 z-50">
    <div class="mb-8 px-4 mt-2">
        <h1 class="text-xl font-black text-indigo-600">Nexus <span class="text-slate-900">MRP</span></h1>
        <p class="text-xs text-slate-500 font-medium uppercase tracking-wider mt-1">Production Hub</p>
    </div>

    <nav class="flex-1 flex flex-col gap-1" id="sidebar-nav"
         hx-headers='{"Cache-Control": "no-cache"}'
         hx-sync="this:replace"
         hx-indicator="#main-content">
        <a class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all {% if request.resolver_match.url_name == 'pm_production' %}bg-indigo-50 text-indigo-700{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-50{% endif %}"
           href="{% url 'pm_production' %}"
           hx-get="{% url 'pm_production' %}"
           hx-target="#main-content"
           hx-push-url="true"
           hx-on::after-request="updateActiveLink(this)">
            <span class="material-symbols-outlined" style="{% if request.resolver_match.url_name == 'pm_production' %}font-variation-settings:'FILL' 1;{% endif %}">precision_manufacturing</span>
            <span>Production</span>
        </a>
        <a class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all {% if request.resolver_match.url_name == 'pm_ledger' %}bg-indigo-50 text-indigo-700{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-50{% endif %}"
           href="{% url 'pm_ledger' %}"
           hx-get="{% url 'pm_ledger' %}"
           hx-target="#main-content"
           hx-push-url="true"
           hx-on::after-request="updateActiveLink(this)">
            <span class="material-symbols-outlined" style="{% if request.resolver_match.url_name == 'pm_ledger' %}font-variation-settings:'FILL' 1;{% endif %}">inventory_2</span>
            <span>Material Ledger</span>
        </a>
        <a class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all {% if request.resolver_match.url_name == 'pm_history' %}bg-indigo-50 text-indigo-700{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-50{% endif %}"
           href="{% url 'pm_history' %}"
           hx-get="{% url 'pm_history' %}"
           hx-target="#main-content"
           hx-push-url="true"
           hx-on::after-request="updateActiveLink(this)">
            <span class="material-symbols-outlined" style="{% if request.resolver_match.url_name == 'pm_history' %}font-variation-settings:'FILL' 1;{% endif %}">history</span>
            <span>Prod. History</span>
        </a>
        <a class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-sm font-semibold transition-all {% if request.resolver_match.url_name == 'pm_notifications' %}bg-indigo-50 text-indigo-700{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-50{% endif %}"
           href="{% url 'pm_notifications' %}"
           hx-get="{% url 'pm_notifications' %}"
           hx-target="#main-content"
           hx-push-url="true"
           hx-on::after-request="updateActiveLink(this)">
            <span class="material-symbols-outlined" style="{% if request.resolver_match.url_name == 'pm_notifications' %}font-variation-settings:'FILL' 1;{% endif %}">notifications</span>
            <span>Notifications</span>
        </a>
    </nav>

    <div class="mt-auto border-t border-slate-100 pt-4">
        <a href="{% url 'logout' %}" class="w-full flex items-center gap-3 px-4 py-2.5 text-red-600 hover:bg-red-50 transition-all rounded-lg text-sm font-semibold">
            <span class="material-symbols-outlined">logout</span>
            <span>Sign Out</span>
        </a>
    </div>
</aside>

<main class="ml-64 min-h-screen" id="main-content">
    {% block content %}
    <div class="flex flex-col items-center justify-center h-screen text-slate-400">
        <span class="material-symbols-outlined text-6xl mb-4 animate-pulse">precision_manufacturing</span>
        <h2 class="text-xl font-bold">Select a section from the sidebar</h2>
    </div>
    {% endblock %}
</main>

<script>
    function updateActiveLink(el) {
        document.querySelectorAll('#sidebar-nav a').forEach(link => {
            link.classList.remove('bg-indigo-50', 'text-indigo-700');
            link.classList.add('text-slate-600');
            const icon = link.querySelector('.material-symbols-outlined');
            if (icon) icon.style.fontVariationSettings = "'FILL' 0";
        });
        el.classList.add('bg-indigo-50', 'text-indigo-700');
        el.classList.remove('text-slate-600');
        const activeIcon = el.querySelector('.material-symbols-outlined');
        if (activeIcon) activeIcon.style.fontVariationSettings = "'FILL' 1";
    }

    window.onpopstate = function() {
        const currentPath = window.location.pathname;
        const activeLink = document.querySelector(`#sidebar-nav a[href="${currentPath}"]`);
        if (activeLink) updateActiveLink(activeLink);
    };
</script>

</body>
</html>
