<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus ERP | Admin Direct Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet" />
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top right, #4f46e5 0%, #1e1b4b 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }
        .input-glass:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #6366f1;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.2);
        }
        .animate-glow {
            animation: glow 4s infinite alternate;
        }
        @keyframes glow {
            from { text-shadow: 0 0 10px rgba(99, 102, 241, 0.5); }
            to { text-shadow: 0 0 30px rgba(99, 102, 241, 0.8), 0 0 50px rgba(99, 102, 241, 0.4); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 overflow-hidden">

    <!-- Decorative Elements -->
    <div class="fixed top-[-10%] left-[-5%] w-[40%] h-[40%] bg-indigo-600/20 rounded-full blur-[120px]"></div>
    <div class="fixed bottom-[-10%] right-[-5%] w-[40%] h-[40%] bg-purple-600/20 rounded-full blur-[120px]"></div>

    <div class="w-full max-w-lg z-10">
        <!-- Logo Area -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-indigo-600 rounded-3xl shadow-2xl shadow-indigo-500/40 mb-6 rotate-12 transition-transform hover:rotate-0 duration-500">
                <span class="material-symbols-outlined text-white text-4xl font-bold">admin_panel_settings</span>
            </div>
            <h1 class="text-4xl font-black text-white tracking-tight mb-2 animate-glow">Nexus <span class="text-indigo-400">Admin</span></h1>
            <p class="text-indigo-200/60 font-medium">Elevated Direct Access for Team Members</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-[40px] p-10 shadow-2xl">
            {% if error %}
            <div class="mb-8 p-4 bg-red-500/10 border border-red-500/20 rounded-2xl flex items-center gap-3 text-red-400 text-sm animate-bounce">
                <span class="material-symbols-outlined">error</span>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" class="space-y-6">
                {% csrf_token %}
                
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-indigo-300 uppercase tracking-widest ml-1">Account Credentials</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-indigo-400/50">person</span>
                        <input type="text" name="username" placeholder="Username" required
                            class="w-full input-glass rounded-2xl py-4 pl-14 pr-6 outline-none transition-all placeholder:text-indigo-300/30">
                    </div>
                </div>

                <div class="relative">
                    <span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-indigo-400/50">mail</span>
                    <input type="email" name="email" placeholder="Official Email" required
                        class="w-full input-glass rounded-2xl py-4 pl-14 pr-6 outline-none transition-all placeholder:text-indigo-300/30">
                </div>

                <div class="relative">
                    <span class="material-symbols-outlined absolute left-5 top-1/2 -translate-y-1/2 text-indigo-400/50">lock</span>
                    <input type="password" name="password" placeholder="Access Password" required
                        class="w-full input-glass rounded-2xl py-4 pl-14 pr-6 outline-none transition-all placeholder:text-indigo-300/30">
                </div>

                <button type="submit" class="w-full py-5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-xl shadow-indigo-600/20 transition-all active:scale-[0.98] mt-4 flex items-center justify-center gap-3">
                    Verify & Grant Admin Access
                    <span class="material-symbols-outlined text-sm">arrow_forward</span>
                </button>
            </form>

            <div class="mt-10 pt-8 border-t border-white/5 text-center">
                <p class="text-indigo-300/40 text-[10px] font-bold uppercase tracking-[0.2em]">Internal Security Protocol • Dev Mode</p>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="text-center mt-8">
            <a href="/api/users/login/" class="text-indigo-400/60 hover:text-indigo-400 text-xs font-bold transition-colors flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-sm">arrow_back</span>
                Return to Standard Login
            </a>
        </div>
    </div>

</body>
</html>
