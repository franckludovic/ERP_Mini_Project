<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications — ERP System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <style>
        body { font-family: 'Inter', sans-serif; }
        .notif-enter { animation: slideIn 0.3s ease forwards; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen" id="notif-body">

    <!-- Top bar -->
    <div id="top-bar" class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-3">
            <button onclick="history.back()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-slate-100 transition-all">
                <span class="material-symbols-outlined text-slate-500">arrow_back</span>
            </button>
            <div>
                <h1 class="text-lg font-bold text-slate-900 leading-tight">Notifications</h1>
                <p class="text-xs text-slate-400">Your activity feed</p>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span id="unread-badge" class="hidden px-2.5 py-0.5 bg-red-50 text-red-600 text-xs font-bold rounded-full"></span>
            <button onclick="markAllRead()" class="flex items-center gap-2 px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-lg hover:bg-indigo-700 transition-all shadow-sm">
                <span class="material-symbols-outlined text-[16px]">done_all</span>
                Mark all read
            </button>
        </div>
    </div>

    <!-- Content -->
    <div id="content-area" class="max-w-3xl mx-auto mt-8 px-4 pb-16">

        <!-- Empty state -->
        <div id="empty-state" class="hidden py-24 text-center">
            <span class="material-symbols-outlined text-6xl text-slate-200 block mb-4">notifications_off</span>
            <p class="text-slate-500 font-semibold text-lg">You're all caught up!</p>
            <p class="text-slate-400 text-sm mt-1">No notifications right now. Check back later.</p>
        </div>

        <!-- Loading state -->
        <div id="loading-state" class="py-24 text-center">
            <span class="material-symbols-outlined text-4xl text-slate-300 animate-spin block mb-3">progress_activity</span>
            <p class="text-slate-400 text-sm">Loading notifications...</p>
        </div>

        <!-- Notification list -->
        <div id="notification-list" class="space-y-3 hidden"></div>

    </div>

    <!-- Toast -->
    <div id="toast" class="hidden fixed top-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl text-sm font-medium flex items-center gap-2 z-50">
        <span class="material-symbols-outlined text-green-400 text-[18px]">check_circle</span>
        <span id="toast-msg">Done!</span>
    </div>

    <script>
        // Get the logged-in user's ID from the session context
        const userId = {{ user_id|default:"null" }};

        function getPriorityConfig(priority) {
            switch(priority) {
                case 'CRITICAL': return { border: 'border-red-500',   bg: 'bg-red-50',    badge: 'bg-red-100 text-red-700',    icon: 'error' };
                case 'HIGH':     return { border: 'border-amber-500', bg: 'bg-amber-50',  badge: 'bg-amber-100 text-amber-700', icon: 'warning' };
                case 'LOW':      return { border: 'border-blue-400',  bg: 'bg-blue-50',   badge: 'bg-blue-100 text-blue-700',   icon: 'info' };
                default:         return { border: 'border-slate-300', bg: 'bg-white',     badge: 'bg-slate-100 text-slate-600', icon: 'notifications' };
            }
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 2500);
        }

        function loadNotifications() {
            if (!userId) {
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            }

            fetch(`/api/notifications/user/${userId}/`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading-state').classList.add('hidden');
                const container = document.getElementById('notification-list');
                const emptyState = document.getElementById('empty-state');
                const badge = document.getElementById('unread-badge');

                if (!data || data.length === 0) {
                    container.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    badge.classList.add('hidden');
                    return;
                }

                container.classList.remove('hidden');
                emptyState.classList.add('hidden');
                container.innerHTML = '';

                const unreadCount = data.filter(n => !n.is_read).length;
                if (unreadCount > 0) {
                    badge.textContent = `${unreadCount} unread`;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }

                data.forEach(n => {
                    const cfg = getPriorityConfig(n.priority);
                    const timeAgo = new Date(n.created_at).toLocaleString();
                    const div = document.createElement('div');
                    div.className = `notif-enter p-5 rounded-2xl border-l-4 shadow-sm ${cfg.border} ${cfg.bg} ${!n.is_read ? 'ring-1 ring-slate-200' : 'opacity-75'}`;
                    div.innerHTML = `
                        <div class="flex items-start justify-between gap-4">
                            <div class="flex items-start gap-3 flex-1">
                                <span class="material-symbols-outlined text-[22px] mt-0.5 ${!n.is_read ? 'text-indigo-500' : 'text-slate-400'}">${cfg.icon}</span>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-2 flex-wrap mb-1">
                                        <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-widest ${cfg.badge}">${n.priority}</span>
                                        ${!n.is_read ? '<span class="w-2 h-2 rounded-full bg-indigo-500 inline-block"></span>' : ''}
                                    </div>
                                    <p class="text-sm text-slate-800 font-medium leading-snug">${n.message}</p>
                                    <p class="text-xs text-slate-400 mt-1">${timeAgo}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                ${!n.is_read ? `
                                <button onclick="markAsRead(${n.id})" title="Mark as read"
                                    class="w-8 h-8 flex items-center justify-center rounded-lg text-green-600 hover:bg-green-50 transition-all">
                                    <span class="material-symbols-outlined text-[18px]">check</span>
                                </button>` : ''}
                                <button onclick="deleteNotification(${n.id})" title="Delete"
                                    class="w-8 h-8 flex items-center justify-center rounded-lg text-red-400 hover:bg-red-50 transition-all">
                                    <span class="material-symbols-outlined text-[18px]">delete</span>
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            })
            .catch(() => {
                document.getElementById('loading-state').classList.add('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
            });
        }

        function markAsRead(id) {
            fetch(`/api/notifications/read/${id}/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': getCSRFToken() }
            }).then(() => { showToast('Marked as read'); loadNotifications(); });
        }

        function deleteNotification(id) {
            fetch(`/api/notifications/delete/${id}/`, {
                method: 'DELETE',
                headers: { 'X-CSRFToken': getCSRFToken() }
            }).then(() => { showToast('Notification deleted'); loadNotifications(); });
        }

        function markAllRead() {
            fetch(`/api/notifications/mark-all-read/`, {
                method: 'POST',
                headers: { 'X-CSRFToken': getCSRFToken() }
            }).then(() => { showToast('All notifications marked as read'); loadNotifications(); });
        }

        function getCSRFToken() {
            return document.cookie
                .split('; ')
                .find(row => row.startsWith('csrftoken'))
                ?.split('=')[1];
        }

        // Embed mode check
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('embed') === 'true') {
            document.getElementById('top-bar').style.display = 'none';
            document.getElementById('content-area').classList.remove('mt-8');
            document.getElementById('content-area').classList.add('mt-2');
            document.getElementById('notif-body').classList.remove('bg-slate-50');
            document.getElementById('notif-body').classList.add('bg-transparent');
        }

        loadNotifications();
        setInterval(loadNotifications, 10000); // Poll every 10s
    </script>

</body>
</html>
