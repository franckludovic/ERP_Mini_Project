{% extends base_template %}

{% block content %}
<div id="notif-body-container" class="min-h-screen">
    <!-- Content -->
    <div id="content-area" class="w-full max-w-2xl mx-auto py-8 px-4">

        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div class="flex items-center gap-3">
                <h2 class="text-2xl font-bold text-slate-900">Notifications</h2>
                <span id="unread-badge"
                    class="hidden px-2 py-0.5 bg-indigo-100 text-indigo-700 text-[10px] font-bold rounded-full uppercase tracking-wider"></span>
                <button onclick="loadNotifications()"
                    class="p-1.5 text-slate-400 hover:text-indigo-600 transition-all rounded-lg hover:bg-slate-50"
                    title="Refresh">
                    <span class="material-symbols-outlined text-[20px]">refresh</span>
                </button>
            </div>
            <button onclick="markAllRead()"
                class="flex items-center gap-1.5 text-sm font-semibold text-indigo-600 hover:text-indigo-700 transition-all">
                <span class="material-symbols-outlined text-[18px]">done_all</span>
                Mark all read
            </button>
        </div>

        <!-- Empty state -->
        <div id="empty-state" class="hidden py-16 text-center">
            <span class="material-symbols-outlined text-5xl text-slate-200 block mb-3">notifications_off</span>
            <p class="text-slate-500 font-semibold text-base">You're all caught up!</p>
            <p class="text-slate-400 text-xs mt-1">No notifications right now.</p>
        </div>

        <!-- Loading state -->
        <div id="loading-state" class="py-16 text-center">
            <span
                class="material-symbols-outlined text-3xl text-slate-300 animate-spin block mb-3">progress_activity</span>
            <p class="text-slate-400 text-xs">Loading notifications...</p>
        </div>

        <!-- Notification list -->
        <div id="notification-list" class="space-y-4 hidden"></div>

    </div>

    <!-- Toast -->
    <div id="toast"
        class="hidden fixed top-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-xl text-sm font-medium flex items-center gap-2 z-50">
        <span class="material-symbols-outlined text-green-400 text-[18px]">check_circle</span>
        <span id="toast-msg">Done!</span>
    </div>
</div>

<script>
    // Get the logged-in user's ID from the session context
    var userId = {{ user_id|default:"null" }};

    function getPriorityConfig(priority) {
        switch (priority) {
            case 'CRITICAL': return { border: 'border-red-500', bg: 'bg-red-50', badge: 'bg-red-100 text-red-700', icon: 'error' };
            case 'HIGH': return { border: 'border-amber-500', bg: 'bg-amber-50', badge: 'bg-amber-100 text-amber-700', icon: 'warning' };
            case 'LOW': return { border: 'border-blue-400', bg: 'bg-blue-50', badge: 'bg-blue-100 text-blue-700', icon: 'info' };
            default: return { border: 'border-slate-300', bg: 'bg-white', badge: 'bg-slate-100 text-slate-600', icon: 'notifications' };
        }
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        if (!t) return;
        document.getElementById('toast-msg').textContent = msg;
        t.classList.remove('hidden');
        setTimeout(() => t.classList.add('hidden'), 2500);
    }

    function loadNotifications() {
        if (!userId) {
            const loading = document.getElementById('loading-state');
            const empty = document.getElementById('empty-state');
            if (loading) loading.classList.add('hidden');
            if (empty) empty.classList.remove('hidden');
            return;
        }

        fetch(`/api/notifications/user/${userId}/`)
            .then(res => res.json())
            .then(data => {
                const loading = document.getElementById('loading-state');
                if (loading) loading.classList.add('hidden');

                const container = document.getElementById('notification-list');
                const emptyState = document.getElementById('empty-state');
                const badge = document.getElementById('unread-badge');

                if (!container || !emptyState || !badge) return;

                if (!data || data.length === 0) {
                    container.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    badge.classList.add('hidden');
                    return;
                }

                container.classList.remove('hidden');
                emptyState.classList.add('hidden');
                container.innerHTML = '';

                const unreadCount = data.filter(n => !n.is_read).length;
                if (unreadCount > 0) {
                    badge.textContent = `${unreadCount} unread`;
                    badge.classList.remove('hidden');
                } else {
                    badge.classList.add('hidden');
                }

                data.forEach(n => {
                    const cfg = getPriorityConfig(n.priority);
                    const timeAgo = new Date(n.created_at).toLocaleString();
                    const div = document.createElement('div');
                    div.className = `p-5 rounded-2xl border-l-4 shadow-sm ${cfg.border} ${cfg.bg} ${!n.is_read ? 'ring-1 ring-slate-200' : 'opacity-75'}`;
                    div.innerHTML = `
                    <div class="flex items-start justify-between gap-4">
                        <div class="flex items-start gap-3 flex-1">
                            <span class="material-symbols-outlined text-[22px] mt-0.5 ${!n.is_read ? 'text-indigo-500' : 'text-slate-400'}">${cfg.icon}</span>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center gap-2 flex-wrap mb-1">
                                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-widest ${cfg.badge}">${n.priority}</span>
                                    ${!n.is_read ? '<span class="w-2 h-2 rounded-full bg-indigo-500 inline-block"></span>' : ''}
                                </div>
                                <p class="text-sm text-slate-800 font-medium leading-snug">${n.message}</p>
                                <p class="text-xs text-slate-400 mt-1">${timeAgo}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 shrink-0">
                            ${!n.is_read ? `
                            <button onclick="markAsRead(${n.id})" title="Mark as read"
                                class="w-8 h-8 flex items-center justify-center rounded-lg text-green-600 hover:bg-green-50 transition-all">
                                <span class="material-symbols-outlined text-[18px]">check</span>
                            </button>` : ''}
                            <button onclick="deleteNotification(${n.id})" title="Delete"
                                class="w-8 h-8 flex items-center justify-center rounded-lg text-red-400 hover:bg-red-50 transition-all">
                                <span class="material-symbols-outlined text-[18px]">delete</span>
                            </button>
                        </div>
                    </div>
                `;
                    container.appendChild(div);
                });
            })
            .catch(() => {
                const loading = document.getElementById('loading-state');
                const empty = document.getElementById('empty-state');
                if (loading) loading.classList.add('hidden');
                if (empty) empty.classList.remove('hidden');
            });
    }

    function markAsRead(id) {
        fetch(`/api/notifications/read/${id}/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': getCSRFToken() }
        }).then(() => { showToast('Marked as read'); loadNotifications(); });
    }

    function deleteNotification(id) {
        fetch(`/api/notifications/delete/${id}/`, {
            method: 'DELETE',
            headers: { 'X-CSRFToken': getCSRFToken() }
        }).then(() => { showToast('Notification deleted'); loadNotifications(); });
    }

    function markAllRead() {
        fetch(`/api/notifications/mark-all-read/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': getCSRFToken() }
        }).then(() => { showToast('All notifications marked as read'); loadNotifications(); });
    }

    function getCSRFToken() {
        return document.cookie
            .split('; ')
            .find(row => row.startsWith('csrftoken'))
            ?.split('=')[1] || "{{ csrf_token }}";
    }

    loadNotifications();
</script>
{% endblock %}
