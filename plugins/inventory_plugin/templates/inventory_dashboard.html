{% extends base_template %}

{% block content %}
<main class="min-h-screen">
    <div class="p-8 max-w-7xl mx-auto space-y-8">
        <!-- Unified Header Area -->
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-4">
                <h2 class="text-2xl font-bold tracking-tight text-slate-900">Inventory Dashboard</h2>
                <span class="bg-indigo-50 text-indigo-700 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-widest">Admin Control</span>
                <button onclick="loadProducts(); loadMaterials();" class="p-1.5 text-slate-400 hover:text-indigo-600 transition-all rounded-lg hover:bg-slate-50" title="Refresh">
                    <span class="material-symbols-outlined text-[20px]">refresh</span>
                </button>
            </div>
        </div>

        <!-- Tabs & Actions -->
        <div class="flex justify-between items-center">
            <div class="flex p-1 bg-slate-100 rounded-xl w-fit border border-slate-200">
                <button id="btnProducts" class="px-6 py-2 rounded-lg text-sm font-bold transition-all bg-white text-indigo-600 shadow-sm border border-slate-100">Products</button>
                <button id="btnMaterials" class="px-6 py-2 rounded-lg text-sm font-bold transition-all text-slate-500 hover:text-slate-900">Materials</button>
            </div>
            <div id="action-buttons">
                <button onclick="openModal('modal-add-product')" class="px-6 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">add</span> Add Product
                </button>
                <button onclick="openModal('modal-add-material')" id="btn-add-mat" class="hidden px-6 py-2.5 bg-slate-900 text-white rounded-xl text-sm font-bold shadow-lg shadow-slate-200 hover:bg-black transition-all flex items-center gap-2">
                    <span class="material-symbols-outlined text-sm">add</span> Add Material
                </button>
            </div>
        </div>

        <!-- Products Table -->
        <div id="productsTable" class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/50">
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Product</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider text-center">Stock</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider text-center">Price</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsBody" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>

        <!-- Materials Table -->
        <div id="materialsTable" class="hidden bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/50">
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">ID</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Material</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider text-center">Stock</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider text-center">Price</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Supplier</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="materialsBody" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Modal: Product Details (BOM) -->
<div id="modal-product-details" class="modal">
    <div class="bg-white rounded-3xl w-full max-w-2xl p-8 shadow-2xl relative">
        <button onclick="closeModal('modal-product-details')" class="absolute top-6 right-6 text-slate-400 hover:text-slate-900"><span class="material-symbols-outlined">close</span></button>
        <h3 class="text-2xl font-black text-slate-900 tracking-tight mb-2" id="modal-prod-name">Product Name</h3>
        <p class="text-sm text-slate-400 font-bold mb-6" id="modal-prod-id">#PRD-0</p>
        
        <div class="bg-slate-50 rounded-2xl p-6">
            <h4 class="text-xs font-black text-indigo-600 uppercase tracking-widest mb-4">Bill of Materials</h4>
            <div class="overflow-hidden border border-slate-100 rounded-xl bg-white">
                <table class="w-full text-left">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-4 py-2 text-[10px] font-bold text-slate-400 uppercase">Material</th>
                            <th class="px-4 py-2 text-[10px] font-bold text-slate-400 uppercase text-center">Required</th>
                            <th class="px-4 py-2 text-[10px] font-bold text-slate-400 uppercase text-right">On Hand</th>
                        </tr>
                    </thead>
                    <tbody id="modal-bom-body" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Add Product -->
<div id="modal-add-product" class="modal">
    <div class="bg-white rounded-3xl w-full max-w-xl p-8 shadow-2xl relative">
        <button onclick="closeModal('modal-add-product')" class="absolute top-6 right-6 text-slate-400 hover:text-slate-900"><span class="material-symbols-outlined">close</span></button>
        <h3 class="text-2xl font-black text-slate-900 mb-6">Create New Product</h3>
        <div class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Product Name</label>
                <input id="add-prod-name" type="text" placeholder="e.g. Luxury Chair" class="w-full border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-indigo-600" />
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Unit Price (FCFA)</label>
                <input id="add-prod-price" type="number" placeholder="25000" class="w-full border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-indigo-600" />
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Materials Required</label>
                <div class="max-h-40 overflow-y-auto border border-slate-100 rounded-xl p-4 space-y-2" id="mat-selection-list">
                    <!-- Materials list will be injected here -->
                </div>
            </div>
            <button onclick="submitCreateProduct()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-indigo-700 transition-all mt-4 shadow-lg shadow-indigo-100">Save Product</button>
        </div>
    </div>
</div>

<!-- Modal: Add Material -->
<div id="modal-add-material" class="modal">
    <div class="bg-white rounded-3xl w-full max-w-md p-8 shadow-2xl relative">
        <button onclick="closeModal('modal-add-material')" class="absolute top-6 right-6 text-slate-400 hover:text-slate-900"><span class="material-symbols-outlined">close</span></button>
        <h3 class="text-2xl font-black text-slate-900 mb-6">Create New Material</h3>
        <div class="space-y-4">
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Material Name</label>
                <input id="add-mat-name" type="text" placeholder="e.g. Oak Wood" class="w-full border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-indigo-600" />
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Initial Quantity</label>
                <input id="add-mat-qty" type="number" value="0" class="w-full border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-indigo-600" />
            </div>
            <div>
                <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Unit Price (FCFA)</label>
                <input id="add-mat-price" type="number" placeholder="5000" class="w-full border-slate-200 rounded-xl px-4 py-3 text-sm focus:ring-indigo-600" />
            </div>
            <button onclick="submitCreateMaterial()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-black transition-all mt-4 shadow-lg shadow-slate-200">Save Material</button>
        </div>
    </div>
</div>

<script>
    var API_BASE = "/api/inventory";
    var productsData = [];
    var materialsData = [];

    var btnProducts = document.getElementById("btnProducts");
    var btnMaterials = document.getElementById("btnMaterials");
    var productsTable = document.getElementById("productsTable");
    var materialsTable = document.getElementById("materialsTable");
    var btnAddProd = document.querySelector('button[onclick*="modal-add-product"]');
    var btnAddMat = document.getElementById("btn-add-mat");

    if (btnProducts) {
        btnProducts.onclick = () => {
            productsTable.classList.remove("hidden");
            materialsTable.classList.add("hidden");
            btnAddProd.classList.remove("hidden");
            btnAddMat.classList.add("hidden");
            btnProducts.className = "px-6 py-2 rounded-lg text-sm font-bold transition-all bg-white text-indigo-600 shadow-sm border border-slate-100";
            btnMaterials.className = "px-6 py-2 rounded-lg text-sm font-bold transition-all text-slate-500 hover:text-slate-900";
        };
    }

    if (btnMaterials) {
        btnMaterials.onclick = () => {
            materialsTable.classList.remove("hidden");
            productsTable.classList.add("hidden");
            btnAddProd.classList.add("hidden");
            btnAddMat.classList.remove("hidden");
            btnMaterials.className = "px-6 py-2 rounded-lg text-sm font-bold transition-all bg-white text-indigo-600 shadow-sm border border-slate-100";
            btnProducts.className = "px-6 py-2 rounded-lg text-sm font-bold transition-all text-slate-500 hover:text-slate-900";
        };
    }

    function openModal(id) { 
        const m = document.getElementById(id);
        m.classList.add('active');
        if(id === 'modal-add-product') populateMaterialChecklist(); 
    }
    function closeModal(id) { 
        const m = document.getElementById(id);
        m.classList.remove('active');
    }

    async function loadProducts() {
        try {
            const res = await fetch(`${API_BASE}/all-products`);
            productsData = await res.json();
            const tbody = document.getElementById("productsBody");
            if (!tbody) return;
            tbody.innerHTML = "";
            productsData.forEach(p => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4 text-xs font-bold text-slate-400 tracking-tighter">#PRD-${p.id}</td>
                        <td class="px-6 py-4 text-sm font-bold text-slate-900">${p.name}</td>
                        <td class="px-6 py-4 text-center">
                            <span class="px-2 py-1 rounded-full text-[10px] font-black ${p.quantity_in_stock < 5 ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}">
                                ${p.quantity_in_stock} UNITS
                            </span>
                        </td>
                        <td class="px-6 py-4 text-center text-sm font-bold text-slate-600">${parseFloat(p.unit_price).toLocaleString()} FCFA</td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex justify-end gap-2">
                                <button onclick="showDetails(${p.id})" class="p-1.5 text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all" title="View BOM">
                                    <span class="material-symbols-outlined text-sm">info</span>
                                </button>
                                <button onclick="addStock(${p.id})" class="p-1.5 text-emerald-600 hover:bg-emerald-50 rounded-lg transition-all"><span class="material-symbols-outlined text-sm">add_circle</span></button>
                                <button onclick="deleteProduct(${p.id})" class="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg transition-all"><span class="material-symbols-outlined text-sm">delete</span></button>
                            </div>
                        </td>
                    </tr>`;
            });
        } catch (err) { console.error(err); }
    }

    async function loadMaterials() {
        try {
            const res = await fetch(`${API_BASE}/all-materials`);
            materialsData = await res.json();
            const tbody = document.getElementById("materialsBody");
            if (!tbody) return;
            tbody.innerHTML = "";
            materialsData.forEach(m => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4 text-xs font-bold text-slate-400 tracking-tighter">#MAT-${m.id}</td>
                        <td class="px-6 py-4 text-sm font-bold text-slate-900">${m.name}</td>
                        <td class="px-6 py-4 text-center">
                            <span class="px-2 py-1 rounded-full text-[10px] font-black bg-blue-50 text-blue-600">${m.quantity_in_stock} KG/UNITS</span>
                        </td>
                        <td class="px-6 py-4 text-center text-sm font-bold text-slate-600">${parseFloat(m.unit_price).toLocaleString()} FCFA</td>
                        <td class="px-6 py-4 text-sm font-medium text-slate-500">${m.supplier_name || "Internal"}</td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex justify-end gap-2">
                                <button onclick="addMaterialQty(${m.id})" class="p-1.5 text-emerald-600 hover:bg-emerald-50 rounded-lg transition-all"><span class="material-symbols-outlined text-sm">add_circle</span></button>
                                <button onclick="deleteMaterial(${m.id})" class="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg transition-all"><span class="material-symbols-outlined text-sm">delete</span></button>
                            </div>
                        </td>
                    </tr>`;
            });
        } catch (err) { console.error(err); }
    }

    function showDetails(id) {
        const product = productsData.find(p => p.id === id);
        if(!product) return;
        document.getElementById('modal-prod-name').innerText = product.name;
        document.getElementById('modal-prod-id').innerText = `#PRD-${product.id}`;
        const tbody = document.getElementById('modal-bom-body');
        tbody.innerHTML = "";
        
        if(product.materials && product.materials.length > 0) {
            product.materials.forEach(m => {
                tbody.innerHTML += `
                    <tr>
                        <td class="px-4 py-3 text-sm font-bold text-slate-700">${m.material_name}</td>
                        <td class="px-4 py-3 text-sm font-black text-indigo-600 text-center">${m.quantity_required}</td>
                        <td class="px-4 py-3 text-right">
                            <span class="px-2 py-1 rounded-full text-[9px] font-black ${m.material_stock < m.quantity_required ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}">
                                ${m.material_stock} ON HAND
                            </span>
                        </td>
                    </tr>`;
            });
        } else {
            tbody.innerHTML = `<tr><td colspan="3" class="px-4 py-8 text-center text-xs text-slate-400 italic">No materials linked to this product.</td></tr>`;
        }
        openModal('modal-product-details');
    }

    function populateMaterialChecklist() {
        const list = document.getElementById('mat-selection-list');
        if (!list) return;
        list.innerHTML = "";
        materialsData.forEach(m => {
            list.innerHTML += `
                <div class="flex items-center gap-3 p-2 hover:bg-slate-50 rounded-lg">
                    <input type="checkbox" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-600 material-checkbox" value="${m.id}" data-name="${m.name}">
                    <div class="flex-1">
                        <p class="text-xs font-bold text-slate-700">${m.name}</p>
                        <p class="text-[9px] text-slate-400">Stock: ${m.quantity_in_stock}</p>
                    </div>
                    <input type="number" class="w-16 text-xs border-slate-200 rounded material-qty" value="1" min="1" step="0.1">
                </div>`;
        });
    }

    async function submitCreateProduct() {
        const name = document.getElementById('add-prod-name').value;
        const price = document.getElementById('add-prod-price').value;
        const materials = [];
        document.querySelectorAll('.material-checkbox:checked').forEach(cb => {
            const qtyInput = cb.closest('div').querySelector('.material-qty');
            materials.push({ id: parseInt(cb.value), quantity: parseFloat(qtyInput.value) });
        });

        if(!name || !price) return alert("Please fill all fields");

        const res = await fetch(`${API_BASE}/create-product`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
            body: JSON.stringify({ name, unit_price: parseFloat(price), materials })
        });
        if(res.ok) { closeModal('modal-add-product'); loadProducts(); } else { alert("Error creating product"); }
    }

    async function submitCreateMaterial() {
        const name = document.getElementById('add-mat-name').value;
        const qty = document.getElementById('add-mat-qty').value;
        const price = document.getElementById('add-mat-price').value;
        if(!name) return alert("Please enter name");

        const res = await fetch(`${API_BASE}/create-material`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
            body: JSON.stringify({ name, quantity_in_stock: parseFloat(qty), unit_price: parseFloat(price || 0) })
        });
        if(res.ok) { closeModal('modal-add-material'); loadMaterials(); } else { alert("Error creating material"); }
    }

    async function addStock(id) {
        const qty = prompt("Add quantity:");
        if(!qty) return;
        await fetch(`${API_BASE}/add-product`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
            body: JSON.stringify({ id, quantity: parseInt(qty) })
        });
        loadProducts();
    }

    async function addMaterialQty(id) {
        const qty = prompt("Add material quantity:");
        if(!qty) return;
        await fetch(`${API_BASE}/add-material`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
            body: JSON.stringify({ id, quantity: parseFloat(qty) })
        });
        loadMaterials();
    }

    async function deleteProduct(id) { 
        if(confirm("Delete product?")) { 
            await fetch(`${API_BASE}/delete-product`, { 
                method: 'DELETE', 
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' }, 
                body: JSON.stringify({ id }) 
            }); 
            loadProducts(); 
        } 
    }
    async function deleteMaterial(id) { 
        if(confirm("Delete material?")) { 
            await fetch(`${API_BASE}/delete-material`, { 
                method: 'DELETE', 
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' }, 
                body: JSON.stringify({ id }) 
            }); 
            loadMaterials(); 
        } 
    }

    loadProducts();
    loadMaterials();
</script>
{% endblock %}
